<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Class 10</title>
    <style>
        body {

            font-family: Arial, sans-serif;

            background: aliceblue;

            text-align: center;

            padding: 30px;

        }

        h1 {
            color: #ff5a43;
        }

        button {

            background: #ff5a43;

            color: white;

            padding: 10px 25px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            margin: 5px;

        }

        div {

            border: 1px solid #ff5a43;

            width: 280px;

            margin: 6px auto;

            padding: 8px 12px;

            text-align: left;

            border-radius: 6px;

        }
    </style>
</head>

<body>
    <h1>My Delivery Tracker</h1>
    <button onclick="saveOrder()">Save Order</button>
    <button onclick="startdelivery()">Start delivery</button>

    <div>JSON TEXT: <span id="json-text"></span></div>
    <div>Loaded Item: <span id="loaded-item"></span></div>
    <div>Loaded Price: <span id="loaded-price"></span></div>
    <div>Status: <span id="status"></span></div>
    <div>Result: <span id="result"></span></div>

    <script>

        let order = {
            item: "Pizza",
            price: 5,
            shop: "Pizza Hut"
        };

        function saveOrder() {
            let jsonText = JSON.stringify(order);
            let loaderOrder = JSON.parse(jsonText);

            document.getElementById("json-text").innerText = jsonText;
            document.getElementById("loaded-item").innerText = loaderOrder.item;
            document.getElementById("loaded-price").innerText = "$" + loaderOrder.price;

        }
        function delay(ms) {
            return new Promise(function (resolve) {
                setTimeout(resolve, ms);
            });
        }

        async function startdelivery() {
            document.getElementById("result").innerHTML = "";
            document.getElementById("status").innerHTML = "Order recevied!";
            setTimeout(function () {
                document.getElementById("status").innerHTML = "kitchen is preparing...";
            }, 1000);

            await delay(1000);
            document.getElementById("status").innerHTML = "Out for delivery!";

            await delay(2000);
            document.getElementById("result").innerHTML = "Your order has arrived!";
        }


    </script>
</body>

</html>
