<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Class 11</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: aliceblue;
            padding: 30px;
        }

        h1 {
            color: navy;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
            border-radius: 5px;
            border: 2px solid navy;
        }
        button{
            background: navy;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        #timer {
            color: gray;
        }
        </style>
</head>
<body>
    <h1>Lucky Draw</h1>
    <p>Enter your name and guess a number to win!</p>

    <input type="text" id="name" placeholder="Your name" required><br>
    <p id="msg-name"></p>

    <input type="number" id="guess" placeholder="Guess a number (1 to 5)" min="1" max="5" required><br>
    <p id="msg-guess"></p>

    <button onclick="checkForm()">Try My Luck!</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>

        var seconds = 0
        setInterval(function() {
            seconds = seconds + 1;
            document.getElementById("timer").innerHTML = "Time: " + seconds + " seconds";
        }, 1000);

        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;

            if (name == "") {
                document.getElementById("msg-name").innerHTML = "Please enter your name.";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-name").innerHTML = "Great name!";
                document.getElementById("msg-name").style.color = "green";
            }

            if (guess == "") {
                document.getElementById("msg-guess").innerHTML = "Please enter your guess.";
                document.getElementById("msg-guess").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-guess").innerHTML = "Good guess!";
                document.getElementById("msg-guess").style.color = "green";
            }

            if (ok == true) {
                var luky = Math.floor(Math.random() * 5) + 1; // Generate a random number between 1 and 5   
                if (guess == luky) {
                    document.getElementById("result").innerHTML = "Congratulations " + name + "! You guessed the lucky number " + luky + "!";
                    document.getElementById("result").style.color = "green";
                } else {
                    document.getElementById("result").innerHTML = "Sorry " + name + ", the lucky number was " + luky + ". Better luck next time!";
                    document.getElementById("result").style.color = "red";
                }
                // Process the lucky draw logic here
            }
        }
    </script>
</body>
</html>
