<!DOCTYPE html>
<html>
    <head>
        <title>Class5</title>
    </head>
    <body>
        <h1>JavaScript array Methods</h1>
        <h2>Join() and pop()</h2>
        <p>The join() method joins array method elements into a string and the pop() method removes the last element from an array.</p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var subjects = ["English", "Nepali", "Maths", "Science", "Social"];
            document.getElementById("myjoin").innerHTML = subjects.join(" *");
            document.getElementById("myfirstpop").innerHTML = subjects;
            subjects.pop();
            document.getElementById("mysecondpop").innerHTML = subjects;
        </script>        
    </body>
</html>
